name: TTS problem
description: Report a bug, bad output, or latency issue with TTS.
title: "[TTS] "
labels: ["area:tts", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Takes about 2 minutes. Any language or format is fine; partial info is better than none.
        **Never paste API keys, tokens, or private data.**

  - type: dropdown
    id: category
    attributes:
      label: Product
      options:
        - Higgs Realtime
        - Avatar
        - TTS
        - Other
      default: 2
    validations:
      required: true

  - type: dropdown
    id: issue-type
    attributes:
      label: Issue type
      options:
        - Bug
        - Wrong or poor quality output
        - Latency or performance
        - Docs
        - Feature request

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Blocker
        - Major
        - Minor
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      placeholder: |
        Summary:
        Expected:
        Actual:
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Steps, plus a script or code if you have one. Any language; formatting is optional.
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details (fill what you know)
      description: Paste logs or code as-is; formatting is optional.
      placeholder: |
        SDK/API version:
        Model:
        Endpoint/region:
        OS / language:
        Request IDs + timestamps (with timezone):
        Logs:

  - type: textarea
    id: attachments
    attributes:
      label: Input text, output audio, screenshots
      description: Paste the input text. Drag and drop files here; zip audio files (.wav/.mp3) first.
